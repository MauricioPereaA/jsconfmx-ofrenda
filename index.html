<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ofrenda para mi abuela Lupita Aguilar</title>
    <meta name="description" content="Una ofrenda digital de Día de Muertos para mi abuela Lupita Moreno Pulido, publicada con AWS Amplify Hosting." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2c4 6 8 10 8 17a8 8 0 0 1-16 0c0-7 4-11 8-17z' fill='%23FF9F1C'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Chango&family=Work+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Papel picado: decoración, no necesitas cambiarlo -->
    <svg width="0" height="0" class="sr-only" aria-hidden="true">
      <symbol id="bandera" viewBox="0 0 100 120">
        <path fill-rule="evenodd" d="M0 0H100V108L92 120 83 108 75 120 67 108 58 120 50 108 42 120 33 108 25 120 17 108 8 120 0 108Z
          M12 14a3 3 0 1 0 6 0a3 3 0 1 0-6 0z M29 14a3 3 0 1 0 6 0a3 3 0 1 0-6 0z M47 14a3 3 0 1 0 6 0a3 3 0 1 0-6 0z
          M65 14a3 3 0 1 0 6 0a3 3 0 1 0-6 0z M82 14a3 3 0 1 0 6 0a3 3 0 1 0-6 0z
          M42 52a8 8 0 1 0 16 0a8 8 0 1 0-16 0z
          M61 52a7 7 0 1 0 14 0a7 7 0 1 0-14 0z M25 52a7 7 0 1 0 14 0a7 7 0 1 0-14 0z
          M52 67.6a7 7 0 1 0 14 0a7 7 0 1 0-14 0z M34 67.6a7 7 0 1 0 14 0a7 7 0 1 0-14 0z
          M52 36.4a7 7 0 1 0 14 0a7 7 0 1 0-14 0z M34 36.4a7 7 0 1 0 14 0a7 7 0 1 0-14 0z
          M18 82L25 90 18 98 11 90Z M82 82L89 90 82 98 75 90Z M50 86L54 92 50 98 46 92Z" />
      </symbol>
    </svg>
    <div class="papel-picado" aria-hidden="true">
      <svg class="bandera"><use href="#bandera" /></svg>
      <svg class="bandera"><use href="#bandera" /></svg>
      <svg class="bandera"><use href="#bandera" /></svg>
      <svg class="bandera"><use href="#bandera" /></svg>
      <svg class="bandera"><use href="#bandera" /></svg>
      <svg class="bandera"><use href="#bandera" /></svg>
      <svg class="bandera"><use href="#bandera" /></svg>
      <svg class="bandera"><use href="#bandera" /></svg>
      <svg class="bandera"><use href="#bandera" /></svg>
      <svg class="bandera"><use href="#bandera" /></svg>
    </div>

    <main id="ofrenda" class="ofrenda">
      <h1 class="titulo">Para mi abuela Lupita Moreno Pulido</h1>

      <div class="altar">
        <div class="dedicatoria" id="dedicatoria">
          <p class="pista">Enciende la vela para leer la dedicatoria.</p>
          <p class="texto-dedicatoria">
            Por tu fe, tu amor por el morado y tu calabaza enmielada que nos endulzaba la vida.
            Esta luz es para ti, abuela.
          </p>
        </div>

        <div class="centro">
          <!-- Cirios de iglesia a los lados de la foto -->
          <span class="cirio" aria-hidden="true"></span>
          <img class="retrato" src="abuela-lupita.jpg" alt="Mi abuela Lupita Moreno con una cruz de madera en la mano" />
          <div class="vela" aria-hidden="true">
            <span class="llama"></span>
            <span class="cera"></span>
          </div>
          <span class="cirio" aria-hidden="true"></span>
        </div>

        <div class="nivel nivel-1" aria-hidden="true">
          <span class="flor flor-a flor-morada"></span>
          <span class="flor flor-b"></span>
          <span class="flor flor-c"></span>
          <span class="flor flor-d flor-morada"></span>
          <!-- Calabaza enmielada en su cazuela de barro -->
          <svg class="calabaza" viewBox="0 0 120 72">
            <defs>
              <linearGradient id="barro" x1="0" x2="1">
                <stop offset="0" stop-color="#C4612F" />
                <stop offset="1" stop-color="#7C3214" />
              </linearGradient>
              <linearGradient id="miel" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#E0892E" />
                <stop offset="1" stop-color="#8E3B0C" />
              </linearGradient>
            </defs>
            <path d="M14 38c-10 0-10 12 2 10M106 38c10 0 10 12-2 10" fill="none" stroke="#8E3B18" stroke-width="4" stroke-linecap="round" />
            <path d="M10 34h100c0 22-22 36-50 36S10 56 10 34z" fill="url(#barro)" />
            <path d="M24 50q6-5 12 0t12 0 12 0 12 0 12 0 12 0" fill="none" stroke="#F2C98F" stroke-width="2" opacity="0.8" />
            <ellipse cx="60" cy="34" rx="50" ry="8" fill="#C9703F" />
            <ellipse cx="60" cy="34" rx="44" ry="5.5" fill="#4A1A06" />
            <g fill="url(#miel)">
              <path d="M24 36C21 24 29 13 40 14C47 15 49 25 46 36Z" />
              <path d="M40 36C37 19 47 5 60 7C70 9 71 23 66 36Z" />
              <path d="M60 36C59 21 69 11 80 13C89 15 91 26 86 36Z" />
              <path d="M80 36C79 25 87 17 95 19C101 21 101 29 97 36Z" />
            </g>
            <g fill="none" stroke="#3F5A22" stroke-width="3" stroke-linecap="round">
              <path d="M24.5 31C23 22 30 14.5 40 15" />
              <path d="M40.5 30C39 17 48 7 60 7.5" />
              <path d="M60.5 30C61 20 70 12.5 80 13.5" />
              <path d="M80.5 31C81 24 88 18.5 95 19.5" />
            </g>
            <g fill="#FFFFFF" opacity="0.5">
              <ellipse cx="36" cy="21" rx="3" ry="1.5" />
              <ellipse cx="54" cy="14" rx="3.5" ry="1.6" />
              <ellipse cx="75" cy="19" rx="3" ry="1.5" />
              <ellipse cx="91" cy="24" rx="2.4" ry="1.2" />
              <ellipse cx="72" cy="37" rx="6" ry="1" opacity="0.5" />
            </g>
          </svg>
        </div>
        <div class="nivel nivel-2" aria-hidden="true">
          <span class="veladora"></span>
          <span class="veladora"></span>
          <span class="veladora"></span>
          <span class="veladora"></span>
        </div>
        <div class="nivel nivel-3" aria-hidden="true">
          <span class="flor flor-e"></span>
          <span class="flor flor-f flor-morada"></span>
          <span class="flor flor-g flor-morada"></span>
          <span class="flor flor-h"></span>
        </div>
      </div>

      <button id="boton-vela" class="boton" type="button" aria-pressed="false" aria-controls="dedicatoria">
        Encender la vela
      </button>
    </main>

    <footer class="pie">
      Publicada con amor por Mauricio Perea <3
    </footer>

    <script src="script.js"></script>
  </body>
</html>
